<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>:3</title>
<style>
  @font-face {
    font-family: 'Impact';
    src: local('Impact');
  }

  :root{
    --pink: #ff9ec7;
    --pink-light: #ffd1e6;
    --pink-deep: #ff5fa2;
    --pink-glow: rgba(255, 143, 193, 0.85);
    --bg-dark: #0a0308;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg-dark);
    font-family:'Impact', 'Arial Narrow Bold', sans-serif;
  }

  /* ---------- BACKGROUND ---------- */
  #bg{
    position:fixed;
    inset:0;
    background-image:url('fina.gif');
    background-size:cover;
    background-position:center;
    filter: blur(18px) brightness(0.35) saturate(1.2);
    transform: scale(1.1);
    transition: filter 1.6s ease, transform 1.6s ease;
    z-index:1;
  }

  #bg.revealed{
    filter: blur(0px) brightness(0.55) saturate(1.3);
    transform: scale(1.0);
  }

  #overlay-dark{
    position:fixed;
    inset:0;
    background: radial-gradient(circle at center, rgba(10,3,8,0.35) 0%, rgba(10,3,8,0.85) 100%);
    z-index:2;
    pointer-events:none;
  }

  /* ---------- CLICK SCREEN ---------- */
  #click-screen{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: opacity 1.2s ease;
  }

  #click-screen.hidden{
    opacity:0;
    pointer-events:none;
  }

  #click-text{
    font-size: clamp(48px, 12vw, 130px);
    color: var(--pink-light);
    letter-spacing: 4px;
    text-shadow:
      0 0 10px var(--pink-glow),
      0 0 30px var(--pink-deep),
      0 0 60px var(--pink-deep);
    animation: pulse 1.8s ease-in-out infinite;
    user-select:none;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.08); opacity:0.75; }
  }

  #hint{
    position:absolute;
    bottom: 8%;
    width:100%;
    text-align:center;
    font-size:16px;
    color: var(--pink);
    letter-spacing:2px;
    opacity:0.7;
    font-family: 'Courier New', monospace;
    animation: blinkHint 2s infinite;
  }

  @keyframes blinkHint{
    0%,100%{opacity:0.7;}
    50%{opacity:0.15;}
  }

  /* ---------- INFO STREAM ---------- */
  #info-wrap{
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:6vh;
    pointer-events:none;
  }

  #info-title{
    font-size: clamp(28px, 6vw, 54px);
    color: var(--pink-light);
    text-shadow: 0 0 15px var(--pink-glow), 0 0 35px var(--pink-deep);
    letter-spacing:3px;
    opacity:0;
    transition: opacity 1.5s ease;
    margin-bottom: 20px;
  }

  #info-title.show{ opacity:1; }

  #stream{
    width:min(90%, 640px);
    display:flex;
    flex-direction:column;
    gap:6px;
    font-family:'Courier New', monospace;
    font-size: clamp(12px, 1.6vw, 16px);
  }

  .line{
    opacity:0;
    transform: translateY(-25px);
    color: var(--pink-light);
    background: rgba(255, 143, 193, 0.07);
    border-left: 3px solid var(--pink-deep);
    padding: 6px 12px;
    border-radius: 2px;
    text-shadow: 0 0 6px rgba(255,143,193,0.5);
    animation: dropIn 0.7s ease forwards;
    backdrop-filter: blur(2px);
  }

  .line b{
    color: var(--pink);
    font-weight:bold;
    margin-right:8px;
  }

  @keyframes dropIn{
    0%{ opacity:0; transform: translateY(-25px); }
    60%{ opacity:1; transform: translateY(4px); }
    100%{ opacity:1; transform: translateY(0); }
  }

  #glow-line{
    position:fixed;
    top:0; left:0; right:0;
    height:3px;
    background: linear-gradient(90deg, transparent, var(--pink-deep), transparent);
    box-shadow: 0 0 20px var(--pink-glow);
    z-index:6;
    opacity:0;
    transition: opacity 1s ease;
  }

  #glow-line.show{ opacity:1; }
</style>
</head>
<body>

  <div id="bg"></div>
  <div id="overlay-dark"></div>
  <div id="glow-line"></div>

  <div id="click-screen">
    <div id="click-text">click :3</div>
    <div id="hint">// tıkla ve gözlerini aç //</div>
  </div>

  <div id="info-wrap">
    <div id="info-title">seni görüyorum 👁</div>
    <div id="stream"></div>
  </div>

  <audio id="song" src="paka.mp3" preload="auto" loop></audio>

<script>
  const clickScreen = document.getElementById('click-screen');
  const bg = document.getElementById('bg');
  const song = document.getElementById('song');
  const stream = document.getElementById('stream');
  const infoTitle = document.getElementById('info-title');
  const glowLine = document.getElementById('glow-line');

  let started = false;

  clickScreen.addEventListener('click', () => {
    if (started) return;
    started = true;

    clickScreen.classList.add('hidden');
    bg.classList.add('revealed');
    glowLine.classList.add('show');

    song.volume = 0;
    song.play().catch(()=>{});
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.04;
      if (vol >= 0.85){ vol = 0.85; clearInterval(fade); }
      song.volume = vol;
    }, 100);

    setTimeout(() => {
      infoTitle.classList.add('show');
      revealInfo();
    }, 900);
  });

  function addLine(label, value, delay){
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'line';
      div.innerHTML = `<b>${label}:</b>${value}`;
      stream.appendChild(div);
    }, delay);
  }

  async function revealInfo(){
    let i = 0;
    const step = 260;

    // Tarayıcı / sistem bilgileri (anında elde edilebilir)
    const ua = navigator.userAgent;
    const platform = navigator.platform || "bilinmiyor";
    const lang = navigator.language || "bilinmiyor";
    const cores = navigator.hardwareConcurrency || "bilinmiyor";
    const mem = navigator.deviceMemory ? navigator.deviceMemory + " GB" : "bilinmiyor";
    const screenRes = `${screen.width}x${screen.height} (${screen.colorDepth}-bit)`;
    const windowRes = `${window.innerWidth}x${window.innerHeight}`;
    const cookies = navigator.cookieEnabled ? "AÇIK" : "KAPALI";
    const dnt = navigator.doNotTrack || "belirtilmemiş";
    const now = new Date().toLocaleString('tr-TR');

    addLine("TARAYICI", ua, step * i++);
    addLine("PLATFORM", platform, step * i++);
    addLine("DİL", lang, step * i++);
    addLine("İŞLEMCİ ÇEKİRDEĞİ", cores, step * i++);
    addLine("BELLEK (yaklaşık)", mem, step * i++);
    addLine("EKRAN ÇÖZÜNÜRLÜĞÜ", screenRes, step * i++);
    addLine("PENCERE BOYUTU", windowRes, step * i++);
    addLine("ÇEREZLER", cookies, step * i++);
    addLine("DO NOT TRACK", dnt, step * i++);
    addLine("ZAMAN", now, step * i++);

    // GPU bilgisi
    try{
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      const dbgInfo = gl.getExtension('WEBGL_debug_renderer_info');
      const renderer = gl.getParameter(dbgInfo.UNMASKED_RENDERER_WEBGL);
      addLine("GPU", renderer, step * i++);
    }catch(e){
      addLine("GPU", "alınamadı", step * i++);
    }

    // Batarya bilgisi
    if (navigator.getBattery){
      try{
        const battery = await navigator.getBattery();
        addLine("BATARYA", `${Math.round(battery.level*100)}% ${battery.charging ? "(şarj oluyor)" : ""}`, step * i++);
      }catch(e){}
    }

    // IP / konum bilgisi (dış servis)
    fetch('https://ipapi.co/json/')
      .then(res => res.json())
      .then(data => {
        addLine("IP ADRESİ", data.ip || "bilinmiyor", step * i);
        addLine("ISS (ISP)", data.org || "bilinmiyor", step * (i+1));
        addLine("ŞEHİR / ÜLKE", `${data.city || "?"}, ${data.country_name || "?"}`, step * (i+2));
        addLine("KOORDİNAT", `${data.latitude || "?"}, ${data.longitude || "?"}`, step * (i+3));
        addLine("SAAT DİLİMİ", data.timezone || "bilinmiyor", step * (i+4));
      })
      .catch(() => {
        addLine("IP ADRESİ", "alınamadı (bağlantı engellendi)", step * i);
      });
  }
</script>

</body>
</html>
