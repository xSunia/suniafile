<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>:3</title>
<style>
  @font-face {
    font-family: 'Impact';
    src: local('Impact');
  }

  :root{
    --pink: #ff5fa2;
    --pink-light: #ffb3d9;
    --pink-deep: #d10058;
    --pink-glow: rgba(255, 60, 140, 0.9);
    --bg-dark: #05010a;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg-dark);
    font-family:'Impact', 'Arial Narrow Bold', sans-serif;
  }

  /* ---------- BACKGROUND ---------- */
  #bg{
    position:fixed;
    inset:0;
    background-image:url('fina.gif');
    background-size:cover;
    background-position:center;
    filter: blur(20px) brightness(0.25) saturate(1.4);
    transform: scale(1.12);
    transition: filter 2s ease, transform 2s ease;
    z-index:1;
  }

  #bg.revealed{
    filter: blur(0px) brightness(0.4) saturate(1.5) contrast(1.15);
    transform: scale(1.0);
  }

  #overlay-dark{
    position:fixed;
    inset:0;
    background: radial-gradient(circle at center, rgba(5,1,10,0.3) 0%, rgba(5,1,10,0.92) 100%);
    z-index:2;
    pointer-events:none;
  }

  /* scanlines for extra creepy CRT feel */
  #scanlines{
    position:fixed;
    inset:0;
    z-index:8;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 2px,
      transparent 4px
    );
    mix-blend-mode: overlay;
    opacity:0.5;
  }

  #noise-flicker{
    position:fixed;
    inset:0;
    z-index:9;
    pointer-events:none;
    background: rgba(255,0,90,0.03);
    opacity:0;
  }

  @keyframes flicker{
    0%, 92%, 100% { opacity: 0; }
    93% { opacity: 0.25; }
    94% { opacity: 0; }
    96% { opacity: 0.15; }
    97% { opacity: 0; }
  }

  #noise-flicker.active{
    animation: flicker 5s infinite;
  }

  /* ---------- CLICK SCREEN ---------- */
  #click-screen{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: opacity 1.4s ease;
  }

  #click-screen.hidden{
    opacity:0;
    pointer-events:none;
  }

  #click-text{
    font-size: clamp(48px, 12vw, 130px);
    color: var(--pink-light);
    letter-spacing: 4px;
    text-shadow:
      0 0 10px var(--pink-glow),
      0 0 30px var(--pink-deep),
      0 0 70px var(--pink-deep);
    animation: pulse 1.8s ease-in-out infinite, glitchText 6s infinite;
    user-select:none;
    position:relative;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.08); opacity:0.7; }
  }

  @keyframes glitchText{
    0%, 94%, 100% { transform: translate(0,0) skew(0deg); filter: none; }
    95% { transform: translate(-3px, 1px) skew(-2deg); filter: hue-rotate(30deg); }
    96% { transform: translate(3px, -1px) skew(2deg); filter: hue-rotate(-20deg); }
    97% { transform: translate(-2px, 0) skew(0deg); filter: none; }
  }

  #hint{
    position:absolute;
    bottom: 8%;
    width:100%;
    text-align:center;
    font-size:15px;
    color: var(--pink);
    letter-spacing:3px;
    opacity:0.6;
    font-family: 'Courier New', monospace;
    animation: blinkHint 2.4s infinite;
    text-transform: uppercase;
  }

  @keyframes blinkHint{
    0%,100%{opacity:0.6;}
    50%{opacity:0.1;}
  }

  /* ---------- INFO STREAM (CENTERED, FLOWS BOTTOM -> TOP, AUTO-FIT) ---------- */
  #info-wrap{
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 20px;
  }

  #info-title{
    font-size: clamp(30px, 6vw, 52px);
    color: var(--pink-light);
    text-shadow: 0 0 15px var(--pink-glow), 0 0 40px var(--pink-deep);
    letter-spacing:3px;
    opacity:0;
    transition: opacity 1.5s ease;
    margin-top: 6vh;
    margin-bottom: 24px;
    text-align:center;
    text-transform: uppercase;
    flex-shrink:0;
  }

  #info-title.show{ opacity:1; }

  /* Sabit yükseklikte kutu: başlık ile alt arası. İçerik burada büyürken
     tamamı bu alana (aşağıdan yukarıya, başlığa kadar) sığacak şekilde
     otomatik ölçeklenir - hem küçültür hem de gerekirse büyütür. */
  #stream{
    width:min(96%, 860px);
    flex:1 1 auto;
    position:relative;
    overflow:hidden;
    pointer-events:none;
  }

  /* Satırları tutan iç kapsayıcı: alta sabitli, yeni satır eklendikçe
     yukarı doğru büyür. */
  #stream-inner{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    font-family:'Courier New', Consolas, monospace;
    transform-origin: bottom center;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }

  .line{
    opacity:0;
    transform: translateY(70px) scale(0.94);
    color: var(--pink-light);
    text-shadow: 0 0 10px rgba(255,60,140,0.85), 0 0 4px #000;
    text-align:center;
    letter-spacing:1.5px;
    animation: leakUp 0.85s cubic-bezier(.2,.8,.2,1) forwards;
    padding: 6px 0;
    line-height: 1.4;
    white-space: nowrap;
  }

  .line b{
    color: var(--pink);
    font-weight:bold;
    margin-right:8px;
    text-shadow: 0 0 12px var(--pink-glow);
  }

  /* Şifre çözülen (decode olan) değer kısmı */
  .line .val{
    color: var(--pink-light);
  }

  /* İlk "who are you?" satırı biraz farklı vurgulansın */
  .line.question b{
    color: var(--pink-light);
  }

  /* Aşağıdan yukarıya doğru süzülme animasyonu (net, blursuz) */
  @keyframes leakUp{
    0%{ opacity:0; transform: translateY(70px) scale(0.9); }
    70%{ opacity:1; transform: translateY(-4px) scale(1.02); }
    100%{ opacity:1; transform: translateY(0) scale(1); }
  }

  #glow-line{
    position:fixed;
    top:0; left:0; right:0;
    height:3px;
    background: linear-gradient(90deg, transparent, var(--pink-deep), transparent);
    box-shadow: 0 0 25px var(--pink-glow);
    z-index:6;
    opacity:0;
    transition: opacity 1s ease;
  }

  #glow-line.show{ opacity:1; }

  #watching-eye{
    position:fixed;
    top:14px;
    left:50%;
    transform: translateX(-50%);
    color: var(--pink-deep);
    font-family:'Courier New', monospace;
    font-size:13px;
    letter-spacing:4px;
    opacity:0;
    z-index:7;
    text-transform:uppercase;
    text-shadow: 0 0 10px var(--pink-glow);
    transition: opacity 2s ease;
  }

  #watching-eye.show{
    opacity:0.8;
    animation: creepBlink 3.5s infinite;
  }

  @keyframes creepBlink{
    0%, 90%, 100% { opacity: 0.8; }
    95% { opacity: 0.1; }
  }

  /* ---------- FOLLOWING EYES (kenarlarda imleci takip eden gözler) ---------- */
  .eye{
    position:fixed;
    width:64px;
    height:42px;
    border-radius:50%;
    background:
      radial-gradient(ellipse at center, rgba(20,0,10,0.9) 0%, rgba(60,0,20,0.85) 55%, rgba(10,0,5,0.95) 100%);
    box-shadow:
      0 0 18px rgba(255,60,140,0.55),
      0 0 40px rgba(209,0,88,0.4),
      inset 0 0 12px rgba(255,95,162,0.5);
    border: 1px solid rgba(255,150,190,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:12;
    pointer-events:none;
    opacity:0;
    transition: opacity 2s ease;
    overflow:hidden;
  }

  .eye.show{
    opacity:0.9;
  }

  .eye-left{  top:50%; left:1.5vw;  transform: translateY(-50%); }
  .eye-right{ top:50%; right:1.5vw; transform: translateY(-50%); }
  .eye-bl{    bottom:4vh; left:2.5vw; }
  .eye-br{    bottom:4vh; right:2.5vw; }

  .pupil{
    width:14px;
    height:26px;
    border-radius:50%;
    background: radial-gradient(circle at 50% 30%, #ff9dc7 0%, var(--pink-deep) 45%, #1a0008 100%);
    box-shadow: 0 0 10px var(--pink-glow);
    transform: translate(0,0);
    transition: transform 0.08s linear;
    position:relative;
  }

  .pupil::after{
    content:'';
    position:absolute;
    left:50%;
    top:50%;
    width:2px;
    height:16px;
    background: rgba(5,0,2,0.9);
    transform: translate(-50%,-50%);
    border-radius:2px;
  }

  @keyframes eyeCreepBlink{
    0%, 88%, 100% { transform: scaleY(1); }
    90% { transform: scaleY(0.08); }
    92% { transform: scaleY(1); }
  }

  .eye-left.show{ animation: eyeCreepBlink 4.5s infinite; }
  .eye-right.show{ animation: eyeCreepBlink 4.5s infinite 0.4s; }
  .eye-bl.show{ animation: eyeCreepBlink 4.5s infinite 0.9s; }
  .eye-br.show{ animation: eyeCreepBlink 4.5s infinite 1.3s; }
</style>
</head>
<body>

  <div id="bg"></div>
  <div id="overlay-dark"></div>
  <div id="scanlines"></div>
  <div id="noise-flicker"></div>
  <div id="glow-line"></div>
  <div id="watching-eye">I can see everything you are</div>

  <div class="eye eye-left"><div class="pupil"></div></div>
  <div class="eye eye-right"><div class="pupil"></div></div>
  <div class="eye eye-bl"><div class="pupil"></div></div>
  <div class="eye eye-br"><div class="pupil"></div></div>

  <div id="click-screen">
    <div id="click-text">click :3</div>
    <div id="hint">// touch it if you dare //</div>
  </div>

  <div id="info-wrap">
    <div id="info-title">thank you for data ^-^ </div>
    <div id="stream"><div id="stream-inner"></div></div>
  </div>

  <audio id="song" src="paka.mp3" preload="auto" loop></audio>

<script>
  const clickScreen = document.getElementById('click-screen');
  const bg = document.getElementById('bg');
  const song = document.getElementById('song');
  const stream = document.getElementById('stream');
  const streamInner = document.getElementById('stream-inner');
  const infoTitle = document.getElementById('info-title');
  const glowLine = document.getElementById('glow-line');
  const noiseFlicker = document.getElementById('noise-flicker');
  const watchingEye = document.getElementById('watching-eye');
  const eyes = Array.from(document.querySelectorAll('.eye'));

  let started = false;
  let lastSize = 26; // başlangıç font boyutu

  // Tam ekrana geçmeyi dener (tarayıcı izin verirse)
  function goFullscreen(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req){
      req.call(el).catch(() => {});
    }
  }

  // ---- Gözlerin fareyi takip etmesi ----
  function updateEyes(clientX, clientY){
    eyes.forEach(eye => {
      const rect = eye.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const angle = Math.atan2(dy, dx);
      const maxDist = 10;
      const px = Math.cos(angle) * maxDist;
      const py = Math.sin(angle) * maxDist * 0.55;
      const pupil = eye.querySelector('.pupil');
      pupil.style.transform = `translate(${px}px, ${py}px)`;
    });
  }

  window.addEventListener('mousemove', (e) => updateEyes(e.clientX, e.clientY));
  window.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]){
      updateEyes(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive:true });

  clickScreen.addEventListener('click', () => {
    if (started) return;
    started = true;

    goFullscreen();

    clickScreen.classList.add('hidden');
    bg.classList.add('revealed');
    glowLine.classList.add('show');
    noiseFlicker.classList.add('active');
    eyes.forEach(eye => eye.classList.add('show'));

    song.volume = 0;
    song.play().catch(()=>{});
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.04;
      if (vol >= 0.85){ vol = 0.85; clearInterval(fade); }
      song.volume = vol;
    }, 100);

    setTimeout(() => {
      infoTitle.classList.add('show');
      watchingEye.classList.add('show');
      revealInfo();
    }, 600);
  });

  // Her satır bir öncekinden biraz büyük ya da küçük olur (16px - 34px arası)
  function nextSize(){
    const delta = (Math.random() * 7) - 3.5;
    lastSize = Math.min(34, Math.max(16, lastSize + delta));
    return lastSize;
  }

  // Tüm satırlar başlık ile alt arasındaki alana TAM olarak sığacak/uzanacak
  // şekilde stream-inner'ı ölçekler (gerekirse büyütür, gerekirse küçültür).
  function fitToContainer(){
    streamInner.style.transform = 'scale(1)';
    const naturalHeight = streamInner.scrollHeight;
    const availableHeight = stream.clientHeight;

    if (naturalHeight <= 0) return;

    let scale = availableHeight / naturalHeight;
    scale = Math.min(1.7, Math.max(0.32, scale));
    streamInner.style.transform = `scale(${scale})`;
  }

  // ---- MATRIX TARZI ŞİFRE ÇÖZME EFEKTİ ----
  // Önce hızlıca rastgele karakterler akar, sonra soldan sağa doğru
  // gerçek karakterler kilitlenir (decode).
  const SCRAMBLE_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*<>{}[]/\\-_=+?~";

  function scrambleReveal(el, finalText){
    const text = String(finalText);
    const len = text.length;
    if (len === 0){ el.textContent = ''; return; }

    const totalFrames = 16;       // toplam kaç kare sürecek
    const scrambleFrames = 6;     // ilk N kare boyunca tamamen rastgele akar (hızlı flaş)
    let frame = 0;

    const timer = setInterval(() => {
      let out = '';
      for (let i = 0; i < len; i++){
        const ch = text[i];
        if (ch === ' '){ out += ' '; continue; }

        // her karakterin kilitlenme anı soldan sağa kademeli ilerler
        const revealAt = scrambleFrames + Math.floor((i / len) * (totalFrames - scrambleFrames));

        if (frame >= revealAt){
          out += ch;
        } else {
          out += SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
        }
      }
      el.textContent = out;
      frame++;

      if (frame > totalFrames){
        el.textContent = text;
        clearInterval(timer);
        fitToContainer();
      }
    }, 26); // ~26ms/kare -> hızlı flaş hissi
  }

  function addLine(label, value, delay, extraClass){
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'line' + (extraClass ? ' ' + extraClass : '');
      div.style.fontSize = `${nextSize().toFixed(1)}px`;

      const labelEl = document.createElement('b');
      labelEl.textContent = label + ':';

      const valueEl = document.createElement('span');
      valueEl.className = 'val';

      div.appendChild(labelEl);
      div.appendChild(document.createTextNode(' '));
      div.appendChild(valueEl);

      streamInner.appendChild(div);
      fitToContainer();

      scrambleReveal(valueEl, value);
    }, delay);
  }

  window.addEventListener('resize', fitToContainer);

  function jitter(base, spread){
    return base + Math.floor(Math.random() * spread);
  }

  async function revealInfo(){
    let t = 150;

    addLine("STATUS", "who are you?", t, "question");

    t = jitter(t, 200) + 400;
    fetch('https://ipapi.co/json/')
      .then(res => res.json())
      .then(data => {
        let ti = t;
        addLine("IP ADDRESS", data.ip || "unknown", ti);
        ti = jitter(ti, 150) + 160;
        addLine("ISP", data.org || "unknown", ti);
        ti = jitter(ti, 150) + 160;
        addLine("CITY / COUNTRY", `${data.city || "?"}, ${data.country_name || "?"}`, ti);
        ti = jitter(ti, 150) + 160;
        addLine("REGION", data.region || "unknown", ti);
        ti = jitter(ti, 150) + 160;
        addLine("POSTAL CODE", data.postal || "unknown", ti);
        ti = jitter(ti, 150) + 160;
        addLine("COORDINATES", `${data.latitude || "?"}, ${data.longitude || "?"}`, ti);
        ti = jitter(ti, 150) + 160;
        addLine("TIMEZONE", data.timezone || "unknown", ti);
        ti = jitter(ti, 150) + 160;
        addLine("ASN", data.asn || "unknown", ti);

        continueWithDeviceInfo(ti + jitter(200, 200));
      })
      .catch(() => {
        addLine("IP ADDRESS", "connection blocked", t);
        continueWithDeviceInfo(t + jitter(300, 200));
      });
  }

  async function continueWithDeviceInfo(startDelay){
    const ua = navigator.userAgent;
    const platform = navigator.platform || "unknown";
    const lang = navigator.language || "unknown";
    const langs = navigator.languages ? navigator.languages.join(', ') : lang;
    const cores = navigator.hardwareConcurrency || "unknown";
    const mem = navigator.deviceMemory ? navigator.deviceMemory + " GB" : "unknown";
    const screenRes = `${screen.width}x${screen.height} (${screen.colorDepth}-bit)`;
    const windowRes = `${window.innerWidth}x${window.innerHeight}`;
    const pixelRatio = window.devicePixelRatio || 1;
    const cookies = navigator.cookieEnabled ? "ENABLED" : "DISABLED";
    const cookieCount = document.cookie ? document.cookie.split(';').filter(Boolean).length : 0;
    const dnt = navigator.doNotTrack || "unspecified";
    const now = new Date().toLocaleString('en-US');
    const tzOffset = -new Date().getTimezoneOffset() / 60;
    const referrer = document.referrer || "direct / none";
    const touch = (navigator.maxTouchPoints || 0) > 0 ? `YES (${navigator.maxTouchPoints} points)` : "NO";
    const orientation = (screen.orientation && screen.orientation.type) || "unknown";
    const online = navigator.onLine ? "ONLINE" : "OFFLINE";
    const histLen = history.length || "unknown";
    const visibility = document.visibilityState || "unknown";
    const conn = navigator.connection || {};
    const connType = conn.effectiveType || "unknown";
    const connDown = conn.downlink ? conn.downlink + " Mbps" : "unknown";
    const connRtt = conn.rtt ? conn.rtt + " ms" : "unknown";
    const swSupport = ('serviceWorker' in navigator) ? "SUPPORTED" : "NOT SUPPORTED";
    const storageSupport = (typeof(Storage) !== "undefined") ? "AVAILABLE" : "UNAVAILABLE";
    const pdfViewer = (navigator.pdfViewerEnabled !== undefined) ? (navigator.pdfViewerEnabled ? "YES" : "NO") : "unknown";

    const facts = [
      ["BROWSER", ua],
      ["PLATFORM", platform],
      ["LANGUAGE", lang],
      ["LANGUAGES", langs],
      ["REFERRER", referrer],
      ["CPU THREADS", cores],
      ["MEMORY (approx)", mem],
      ["SCREEN", screenRes],
      ["WINDOW SIZE", windowRes],
      ["PIXEL RATIO", pixelRatio],
      ["ORIENTATION", orientation],
      ["TOUCH SUPPORT", touch],
      ["TIMEZONE OFFSET", `UTC${tzOffset >= 0 ? '+' : ''}${tzOffset}`],
      ["COOKIES", cookies],
      ["COOKIE COUNT", cookieCount],
      ["DO NOT TRACK", dnt],
      ["ONLINE STATUS", online],
      ["CONNECTION TYPE", connType],
      ["DOWNLINK", connDown],
      ["ROUND TRIP TIME", connRtt],
      ["HISTORY LENGTH", histLen],
      ["TAB VISIBILITY", visibility],
      ["SERVICE WORKER", swSupport],
      ["LOCAL STORAGE", storageSupport],
      ["PDF VIEWER", pdfViewer],
      ["LOCAL TIME", now],
    ];

    let t = startDelay;
    facts.forEach(([label, value]) => {
      t = jitter(t, 110) + 140;
      addLine(label, value, t);
    });

    try{
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      const dbgInfo = gl.getExtension('WEBGL_debug_renderer_info');
      const renderer = gl.getParameter(dbgInfo.UNMASKED_RENDERER_WEBGL);
      const vendor = gl.getParameter(dbgInfo.UNMASKED_VENDOR_WEBGL);
      t = jitter(t, 140) + 170;
      addLine("GPU VENDOR", vendor, t);
      t = jitter(t, 140) + 170;
      addLine("GPU RENDERER", renderer, t);
    }catch(e){
      t = jitter(t, 140) + 170;
      addLine("GPU", "could not be read", t);
    }

    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const actx = new AudioCtx();
      t = jitter(t, 140) + 170;
      addLine("AUDIO SAMPLE RATE", `${actx.sampleRate} Hz`, t);
      actx.close && actx.close();
    }catch(e){}

    if (navigator.getBattery){
      try{
        const battery = await navigator.getBattery();
        t = jitter(t, 140) + 170;
        addLine("BATTERY", `${Math.round(battery.level*100)}% ${battery.charging ? "(charging)" : ""}`, t);
      }catch(e){}
    }

    t = jitter(t, 200) + 250;
    addLine("STATUS", "i found you", t);
  }
</script>

</body>
</html>
