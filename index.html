<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lain-space</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            background-color: #1a1118;
            color: #ff6699;
        }

        /* Arka Plan Gif - Tam Ekran ve Net Görünür */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.75) contrast(1.1); /* Arka planın daha net görünmesi için parlaklık artırıldı */
        }

        /* Hafif Karartma Katmanı (Gif'in okunabilirliği bozmaması için) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(26, 17, 24, 0.35);
            z-index: -1;
        }

        /* Giriş (Click :3) Ekranı */
        #enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(26, 17, 24, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        #enter-screen h1 {
            font-size: 3rem;
            color: #ffe4e9;
            text-shadow: 0 0 15px #ff75a0, 0 0 30px #ff75a0;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 25px #ffb7d5; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Bilgi Akış Alanı - Çerçevesiz, doğrudan ekranda akan yapı */
        #content-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 50px 40px;
            display: none;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .terminal-stream {
            max-width: 850px;
            margin: 0 auto;
        }

        .line {
            margin-bottom: 10px;
            font-size: 1.05rem; /* Sabit orta boyut */
            line-height: 1.5;
            color: #ff6699; /* Canlı gül pembesi */
            text-shadow: 0 0 6px rgba(255, 102, 153, 0.6), 0 0 2px #000;
            opacity: 0;
            transform: translateY(15px);
            animation: slideDown 0.5s forwards;
        }

        @keyframes slideDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            color: #ff3377;
            font-size: 1.15rem;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 51, 119, 0.8), 0 0 2px #000;
            opacity: 0;
            transform: translateY(15px);
            animation: slideDown 0.5s forwards;
        }

        .highlight {
            color: #ff99bb;
        }

        /* Scrollbar Özelleştirme */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 102, 153, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <img id="bg-video" src="fina.gif" alt="Background GIF">
    <div class="overlay"></div>

    <audio id="bg-audio" loop>
        <source src="paka.mp3" type="audio/mpeg">
    </audio>

    <div id="enter-screen" onclick="startExperience()">
        <h1>click :3</h1>
    </div>

    <div id="content-container">
        <div class="terminal-stream" id="info-output"></div>
    </div>

    <script>
        function startExperience() {
            const audio = document.getElementById('bg-audio');
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Audio play error:", e));

            const enterScreen = document.getElementById('enter-screen');
            enterScreen.style.opacity = '0';
            setTimeout(() => {
                enterScreen.style.display = 'none';
                const container = document.getElementById('content-container');
                container.style.display = 'block';
                setTimeout(() => container.style.opacity = '1', 50);
                loadUserInfo();
            }, 1000);
        }

        async function loadUserInfo() {
            const output = document.getElementById('info-output');

            let ipData = {};
            try {
                let res = await fetch('https://ipwho.is/');
                ipData = await res.json();
            } catch (e) {
                ipData = {};
            }

            const nav = window.navigator;
            const screenInfo = window.screen;
            
            let gpuVendor = "N/A";
            let gpuRenderer = "N/A";
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    let debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        gpuVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch(e) {}

            let batteryStatus = "N/A";
            let chargingStatus = "N/A";
            if (nav.getBattery) {
                try {
                    let bat = await nav.getBattery();
                    batteryStatus = Math.round(bat.level * 100) + "%";
                    chargingStatus = bat.charging ? "YES" : "NO";
                } catch(e) {}
            }

            const lines = [
                { text: "--- NETWORK ---", type: "title" },
                { text: `IP ADDRESS: <span class="highlight">${ipData.ip || 'N/A'}</span>` },
                { text: `ISP: <span class="highlight">${ipData.connection?.isp || ipData.org || 'N/A'}</span>` },
                { text: `ASN: <span class="highlight">${ipData.connection?.asn || 'N/A'}</span>` },
                { text: `LOCATION: <span class="highlight">${ipData.city || ''}, ${ipData.region || ''}, ${ipData.country || 'N/A'}</span>` },
                { text: `LAT/LONG: <span class="highlight">${ipData.latitude || 'N/A'}, ${ipData.longitude || 'N/A'}</span>` },
                { text: `TIMEZONE: <span class="highlight">${ipData.timezone?.id || 'N/A'}</span>` },
                
                { text: "--- HARDWARE ---", type: "title" },
                { text: `CPU THREADS: <span class="highlight">${nav.hardwareConcurrency || 'N/A'}</span>` },
                { text: `GPU VENDOR: <span class="highlight">${gpuVendor}</span>` },
                { text: `GPU RENDERER: <span class="highlight">${gpuRenderer}</span>` },
                { text: `RAM (JS HEAP): <span class="highlight">${performance.memory ? Math.round(performance.memory.jsHeapSizeLimit / (1024*1024)) + ' MB' : 'Restricted'}</span>` },
                { text: `BATTERY: <span class="highlight">${batteryStatus}</span>` },
                { text: `CHARGING: <span class="highlight">${chargingStatus}</span>` },

                { text: "--- BROWSER & SYSTEM ---", type: "title" },
                { text: `USER AGENT: <span class="highlight">${nav.userAgent}</span>` },
                { text: `PLATFORM: <span class="highlight">${nav.platform || 'N/A'}</span>` },
                { text: `LANGUAGE: <span class="highlight">${nav.language || 'N/A'}</span>` },
                { text: `COOKIES: <span class="highlight">${nav.cookieEnabled ? 'ENABLED' : 'DISABLED'}</span>` },
                { text: `DO NOT TRACK: <span class="highlight">${nav.doNotTrack || 'unspecified'}</span>` },
                { text: `SCREEN: <span class="highlight">${screenInfo.width}x${screenInfo.height} (${screenInfo.colorDepth}-bit)</span>` },
                { text: `WINDOW: <span class="highlight">${window.innerWidth}x${window.innerHeight}</span>` },
                { text: `TIME: <span class="highlight">${new Date().toLocaleString()}</span>` }
            ];

            for (let i = 0; i < lines.length; i++) {
                let div = document.createElement('div');
                div.className = lines[i].type === "title" ? "section-title" : "line";
                div.innerHTML = lines[i].text;
                output.appendChild(div);
                
                let container = document.getElementById('content-container');
                container.scrollTop = container.scrollHeight;

                await new Promise(r => setTimeout(r, 90));
            }
        }
    </script>
</body>
</html>
