<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>:3</title>
<style>
  @font-face {
    font-family: 'Impact';
    src: local('Impact');
  }

  :root{
    --pink: #ff5fa2;
    --pink-light: #ffb3d9;
    --pink-deep: #d10058;
    --pink-glow: rgba(255, 60, 140, 0.9);
    --bg-dark: #05010a;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg-dark);
    font-family:'Impact', 'Arial Narrow Bold', sans-serif;
  }

  /* ---------- BACKGROUND ---------- */
  #bg{
    position:fixed;
    inset:0;
    background-image:url('fina.gif');
    background-size:cover;
    background-position:center;
    filter: blur(20px) brightness(0.25) saturate(1.4);
    transform: scale(1.12);
    transition: filter 2s ease, transform 2s ease;
    z-index:1;
  }

  #bg.revealed{
    filter: blur(0px) brightness(0.4) saturate(1.5) contrast(1.15);
    transform: scale(1.0);
  }

  #overlay-dark{
    position:fixed;
    inset:0;
    background: radial-gradient(circle at center, rgba(5,1,10,0.3) 0%, rgba(5,1,10,0.92) 100%);
    z-index:2;
    pointer-events:none;
  }

  /* scanlines for extra creepy CRT feel */
  #scanlines{
    position:fixed;
    inset:0;
    z-index:8;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 2px,
      transparent 4px
    );
    mix-blend-mode: overlay;
    opacity:0.5;
  }

  #noise-flicker{
    position:fixed;
    inset:0;
    z-index:9;
    pointer-events:none;
    background: rgba(255,0,90,0.03);
    opacity:0;
  }

  @keyframes flicker{
    0%, 92%, 100% { opacity: 0; }
    93% { opacity: 0.25; }
    94% { opacity: 0; }
    96% { opacity: 0.15; }
    97% { opacity: 0; }
  }

  #noise-flicker.active{
    animation: flicker 5s infinite;
  }

  /* ---------- CLICK SCREEN ---------- */
  #click-screen{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: opacity 1.4s ease;
  }

  #click-screen.hidden{
    opacity:0;
    pointer-events:none;
  }

  #click-text{
    font-size: clamp(48px, 12vw, 130px);
    color: var(--pink-light);
    letter-spacing: 4px;
    text-shadow:
      0 0 10px var(--pink-glow),
      0 0 30px var(--pink-deep),
      0 0 70px var(--pink-deep);
    animation: pulse 1.8s ease-in-out infinite, glitchText 6s infinite;
    user-select:none;
    position:relative;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.08); opacity:0.7; }
  }

  @keyframes glitchText{
    0%, 94%, 100% { transform: translate(0,0) skew(0deg); filter: none; }
    95% { transform: translate(-3px, 1px) skew(-2deg); filter: hue-rotate(30deg); }
    96% { transform: translate(3px, -1px) skew(2deg); filter: hue-rotate(-20deg); }
    97% { transform: translate(-2px, 0) skew(0deg); filter: none; }
  }

  #hint{
    position:absolute;
    bottom: 8%;
    width:100%;
    text-align:center;
    font-size:15px;
    color: var(--pink);
    letter-spacing:3px;
    opacity:0.6;
    font-family: 'Courier New', monospace;
    animation: blinkHint 2.4s infinite;
    text-transform: uppercase;
  }

  @keyframes blinkHint{
    0%,100%{opacity:0.6;}
    50%{opacity:0.1;}
  }

  /* ---------- INFO STREAM (centered, leaking downward) ---------- */
  #info-wrap{
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:5vh;
    pointer-events:none;
  }

  #info-title{
    font-size: clamp(24px, 5.5vw, 48px);
    color: var(--pink-light);
    text-shadow: 0 0 15px var(--pink-glow), 0 0 40px var(--pink-deep);
    letter-spacing:3px;
    opacity:0;
    transition: opacity 1.8s ease;
    margin-bottom: 18px;
    text-align:center;
    text-transform: uppercase;
  }

  #info-title.show{ opacity:1; }

  #stream{
    width:min(92%, 620px);
    display:flex;
    flex-direction:column;
    align-items:center;
    font-family:'Courier New', monospace;
    font-size: clamp(11px, 1.5vw, 15px);
    position:relative;
  }

  .line{
    opacity:0;
    transform: translateY(-40px) scale(0.95);
    color: var(--pink-light);
    text-shadow: 0 0 8px rgba(255,60,140,0.7), 0 0 2px #000;
    text-align:center;
    letter-spacing:1px;
    animation: leak 1.1s cubic-bezier(.2,.8,.2,1) forwards;
    padding: 3px 0;
    filter: blur(1px);
  }

  .line b{
    color: var(--pink);
    font-weight:bold;
    margin-right:6px;
    text-shadow: 0 0 10px var(--pink-glow);
  }

  @keyframes leak{
    0%{ opacity:0; transform: translateY(-40px) scale(0.9); filter: blur(4px); }
    30%{ opacity:0.9; filter: blur(0px); }
    60%{ opacity:1; transform: translateY(2px) scale(1.01); }
    100%{ opacity:0.85; transform: translateY(0) scale(1); }
  }

  #glow-line{
    position:fixed;
    top:0; left:0; right:0;
    height:3px;
    background: linear-gradient(90deg, transparent, var(--pink-deep), transparent);
    box-shadow: 0 0 25px var(--pink-glow);
    z-index:6;
    opacity:0;
    transition: opacity 1s ease;
  }

  #glow-line.show{ opacity:1; }

  #watching-eye{
    position:fixed;
    top:14px;
    left:50%;
    transform: translateX(-50%);
    color: var(--pink-deep);
    font-family:'Courier New', monospace;
    font-size:13px;
    letter-spacing:4px;
    opacity:0;
    z-index:7;
    text-transform:uppercase;
    text-shadow: 0 0 10px var(--pink-glow);
    transition: opacity 2s ease;
  }

  #watching-eye.show{
    opacity:0.8;
    animation: creepBlink 3.5s infinite;
  }

  @keyframes creepBlink{
    0%, 90%, 100% { opacity: 0.8; }
    95% { opacity: 0.1; }
  }
</style>
</head>
<body>

  <div id="bg"></div>
  <div id="overlay-dark"></div>
  <div id="scanlines"></div>
  <div id="noise-flicker"></div>
  <div id="glow-line"></div>
  <div id="watching-eye">I can see everything you are</div>

  <div id="click-screen">
    <div id="click-text">click :3</div>
    <div id="hint">// touch it if you dare //</div>
  </div>

  <div id="info-wrap">
    <div id="info-title">i know who you are</div>
    <div id="stream"></div>
  </div>

  <audio id="song" src="paka.mp3" preload="auto" loop></audio>

<script>
  const clickScreen = document.getElementById('click-screen');
  const bg = document.getElementById('bg');
  const song = document.getElementById('song');
  const stream = document.getElementById('stream');
  const infoTitle = document.getElementById('info-title');
  const glowLine = document.getElementById('glow-line');
  const noiseFlicker = document.getElementById('noise-flicker');
  const watchingEye = document.getElementById('watching-eye');

  let started = false;

  clickScreen.addEventListener('click', () => {
    if (started) return;
    started = true;

    clickScreen.classList.add('hidden');
    bg.classList.add('revealed');
    glowLine.classList.add('show');
    noiseFlicker.classList.add('active');

    song.volume = 0;
    song.play().catch(()=>{});
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.04;
      if (vol >= 0.85){ vol = 0.85; clearInterval(fade); }
      song.volume = vol;
    }, 100);

    setTimeout(() => {
      infoTitle.classList.add('show');
      watchingEye.classList.add('show');
      revealInfo();
    }, 1000);
  });

  // adds a line at a random-ish delay so it feels like data is leaking out,
  // not being read off a clean list
  function addLine(label, value, delay){
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'line';
      div.innerHTML = `<b>${label}:</b>${value}`;
      stream.appendChild(div);
    }, delay);
  }

  function jitter(base, spread){
    return base + Math.floor(Math.random() * spread);
  }

  async function revealInfo(){
    const ua = navigator.userAgent;
    const platform = navigator.platform || "unknown";
    const lang = navigator.language || "unknown";
    const cores = navigator.hardwareConcurrency || "unknown";
    const mem = navigator.deviceMemory ? navigator.deviceMemory + " GB" : "unknown";
    const screenRes = `${screen.width}x${screen.height} (${screen.colorDepth}-bit)`;
    const windowRes = `${window.innerWidth}x${window.innerHeight}`;
    const cookies = navigator.cookieEnabled ? "ENABLED" : "DISABLED";
    const dnt = navigator.doNotTrack || "unspecified";
    const now = new Date().toLocaleString('en-US');

    // pool of facts, revealed out of order at irregular intervals
    // to feel like a live leak rather than a neat report
    const facts = [
      ["BROWSER", ua],
      ["PLATFORM", platform],
      ["LANGUAGE", lang],
      ["CPU THREADS", cores],
      ["MEMORY (approx)", mem],
      ["SCREEN", screenRes],
      ["WINDOW SIZE", windowRes],
      ["COOKIES", cookies],
      ["DO NOT TRACK", dnt],
      ["LOCAL TIME", now],
    ];

    let t = 400;
    facts.forEach(([label, value]) => {
      t = jitter(t, 350) + 300;
      addLine(label, value, t);
    });

    // GPU
    try{
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      const dbgInfo = gl.getExtension('WEBGL_debug_renderer_info');
      const renderer = gl.getParameter(dbgInfo.UNMASKED_RENDERER_WEBGL);
      t = jitter(t, 350) + 300;
      addLine("GPU", renderer, t);
    }catch(e){
      t = jitter(t, 350) + 300;
      addLine("GPU", "could not be read", t);
    }

    // Battery
    if (navigator.getBattery){
      try{
        const battery = await navigator.getBattery();
        t = jitter(t, 350) + 300;
        addLine("BATTERY", `${Math.round(battery.level*100)}% ${battery.charging ? "(charging)" : ""}`, t);
      }catch(e){}
    }

    // a couple of unsettling filler lines mixed into the leak
    t = jitter(t, 400) + 400;
    addLine("STATUS", "still watching", t);

    // IP / location (external lookup)
    t = jitter(t, 400) + 500;
    fetch('https://ipapi.co/json/')
      .then(res => res.json())
      .then(data => {
        let ti = t;
        addLine("IP ADDRESS", data.ip || "unknown", ti);
        ti = jitter(ti, 300) + 300;
        addLine("ISP", data.org || "unknown", ti);
        ti = jitter(ti, 300) + 300;
        addLine("CITY / COUNTRY", `${data.city || "?"}, ${data.country_name || "?"}`, ti);
        ti = jitter(ti, 300) + 300;
        addLine("COORDINATES", `${data.latitude || "?"}, ${data.longitude || "?"}`, ti);
        ti = jitter(ti, 300) + 300;
        addLine("TIMEZONE", data.timezone || "unknown", ti);
        ti = jitter(ti, 400) + 500;
        addLine("STATUS", "i found you", ti);
      })
      .catch(() => {
        addLine("IP ADDRESS", "connection blocked", t);
      });
  }
</script>

</body>
</html>
