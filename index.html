<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>:3</title>
<style>
  @font-face {
    font-family: 'Impact';
    src: local('Impact');
  }

  :root{
    --pink: #ff5fa2;
    --pink-light: #ffb3d9;
    --pink-deep: #d10058;
    --pink-glow: rgba(255, 60, 140, 0.9);
    --bg-dark: #05010a;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg-dark);
    font-family:'Impact', 'Arial Narrow Bold', sans-serif;
  }

  /* ---------- BACKGROUND ---------- */
  #bg{
    position:fixed;
    inset:0;
    background-image:url('fina.gif');
    background-size:cover;
    background-position:center;
    filter: blur(20px) brightness(0.25) saturate(1.4);
    transform: scale(1.12);
    transition: filter 2s ease, transform 2s ease;
    z-index:1;
  }

  #bg.revealed{
    filter: blur(0px) brightness(0.4) saturate(1.5) contrast(1.15);
    transform: scale(1.0);
  }

  #overlay-dark{
    position:fixed;
    inset:0;
    background: radial-gradient(circle at center, rgba(5,1,10,0.3) 0%, rgba(5,1,10,0.92) 100%);
    z-index:2;
    pointer-events:none;
  }

  /* scanlines for extra creepy CRT feel */
  #scanlines{
    position:fixed;
    inset:0;
    z-index:8;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 2px,
      transparent 4px
    );
    mix-blend-mode: overlay;
    opacity:0.5;
  }

  #noise-flicker{
    position:fixed;
    inset:0;
    z-index:9;
    pointer-events:none;
    background: rgba(255,0,90,0.03);
    opacity:0;
  }

  @keyframes flicker{
    0%, 92%, 100% { opacity: 0; }
    93% { opacity: 0.25; }
    94% { opacity: 0; }
    96% { opacity: 0.15; }
    97% { opacity: 0; }
  }

  #noise-flicker.active{
    animation: flicker 5s infinite;
  }

  /* ---------- CLICK SCREEN ---------- */
  #click-screen{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: opacity 1.4s ease;
  }

  #click-screen.hidden{
    opacity:0;
    pointer-events:none;
  }

  #click-text{
    font-size: clamp(48px, 12vw, 130px);
    color: var(--pink-light);
    letter-spacing: 4px;
    text-shadow:
      0 0 10px var(--pink-glow),
      0 0 30px var(--pink-deep),
      0 0 70px var(--pink-deep);
    animation: pulse 1.8s ease-in-out infinite, glitchText 6s infinite;
    user-select:none;
    position:relative;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.08); opacity:0.7; }
  }

  @keyframes glitchText{
    0%, 94%, 100% { transform: translate(0,0) skew(0deg); filter: none; }
    95% { transform: translate(-3px, 1px) skew(-2deg); filter: hue-rotate(30deg); }
    96% { transform: translate(3px, -1px) skew(2deg); filter: hue-rotate(-20deg); }
    97% { transform: translate(-2px, 0) skew(0deg); filter: none; }
  }

  #hint{
    position:absolute;
    bottom: 8%;
    width:100%;
    text-align:center;
    font-size:15px;
    color: var(--pink);
    letter-spacing:3px;
    opacity:0.6;
    font-family: 'Courier New', monospace;
    animation: blinkHint 2.4s infinite;
    text-transform: uppercase;
  }

  @keyframes blinkHint{
    0%,100%{opacity:0.6;}
    50%{opacity:0.1;}
  }

  /* ---------- INFO STREAM (CENTERED, FLOWS BOTTOM -> TOP, AUTO-FIT) ---------- */
  #info-wrap{
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 20px;
  }

  #info-title{
    font-size: clamp(30px, 6vw, 52px);
    color: var(--pink-light);
    text-shadow: 0 0 15px var(--pink-glow), 0 0 40px var(--pink-deep);
    letter-spacing:3px;
    opacity:0;
    transition: opacity 1.5s ease;
    margin-top: 6vh;
    margin-bottom: 24px;
    text-align:center;
    text-transform: uppercase;
    flex-shrink:0;
  }

  #info-title.show{ opacity:1; }

  /* Sabit yükseklikte kutu: başlık ile alt arası. İçerik burada büyürken
     tamamı bu alana sığacak şekilde otomatik ölçeklenir. */
  #stream{
    width:min(96%, 820px);
    flex:1 1 auto;
    position:relative;
    overflow:hidden;
    pointer-events:none;
  }

  /* Satırları tutan iç kapsayıcı: alta sabitli, yeni satır eklendikçe
     yukarı doğru büyür. Sığmadığında transform: scale ile küçültülür. */
  #stream-inner{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    font-family:'Courier New', Consolas, monospace;
    transform-origin: bottom center;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }

  .line{
    opacity:0;
    transform: translateY(70px) scale(0.94);
    color: var(--pink-light);
    text-shadow: 0 0 10px rgba(255,60,140,0.85), 0 0 4px #000;
    text-align:center;
    letter-spacing:1.5px;
    animation: leakUp 0.85s cubic-bezier(.2,.8,.2,1) forwards;
    padding: 6px 0;
    line-height: 1.4;
    white-space: nowrap;
  }

  .line b{
    color: var(--pink);
    font-weight:bold;
    margin-right:8px;
    text-shadow: 0 0 12px var(--pink-glow);
  }

  /* İlk "who are you?" satırı biraz farklı vurgulansın */
  .line.question b{
    color: var(--pink-light);
  }

  /* Aşağıdan yukarıya doğru süzülme animasyonu (net, blursuz) */
  @keyframes leakUp{
    0%{ opacity:0; transform: translateY(70px) scale(0.9); }
    70%{ opacity:1; transform: translateY(-4px) scale(1.02); }
    100%{ opacity:1; transform: translateY(0) scale(1); }
  }

  #glow-line{
    position:fixed;
    top:0; left:0; right:0;
    height:3px;
    background: linear-gradient(90deg, transparent, var(--pink-deep), transparent);
    box-shadow: 0 0 25px var(--pink-glow);
    z-index:6;
    opacity:0;
    transition: opacity 1s ease;
  }

  #glow-line.show{ opacity:1; }

  #watching-eye{
    position:fixed;
    top:14px;
    left:50%;
    transform: translateX(-50%);
    color: var(--pink-deep);
    font-family:'Courier New', monospace;
    font-size:13px;
    letter-spacing:4px;
    opacity:0;
    z-index:7;
    text-transform:uppercase;
    text-shadow: 0 0 10px var(--pink-glow);
    transition: opacity 2s ease;
  }

  #watching-eye.show{
    opacity:0.8;
    animation: creepBlink 3.5s infinite;
  }

  @keyframes creepBlink{
    0%, 90%, 100% { opacity: 0.8; }
    95% { opacity: 0.1; }
  }
</style>
</head>
<body>

  <div id="bg"></div>
  <div id="overlay-dark"></div>
  <div id="scanlines"></div>
  <div id="noise-flicker"></div>
  <div id="glow-line"></div>
  <div id="watching-eye">I can see everything you are</div>

  <div id="click-screen">
    <div id="click-text">click :3</div>
    <div id="hint">// touch it if you dare //</div>
  </div>

  <div id="info-wrap">
    <div id="info-title">i know who you are</div>
    <div id="stream"><div id="stream-inner"></div></div>
  </div>

  <audio id="song" src="paka.mp3" preload="auto" loop></audio>

<script>
  const clickScreen = document.getElementById('click-screen');
  const bg = document.getElementById('bg');
  const song = document.getElementById('song');
  const stream = document.getElementById('stream');
  const streamInner = document.getElementById('stream-inner');
  const infoTitle = document.getElementById('info-title');
  const glowLine = document.getElementById('glow-line');
  const noiseFlicker = document.getElementById('noise-flicker');
  const watchingEye = document.getElementById('watching-eye');

  let started = false;
  let lastSize = 26; // başlangıç font boyutu

  // Tam ekrana geçmeyi dener (tarayıcı izin verirse)
  function goFullscreen(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req){
      req.call(el).catch(() => {});
    }
  }

  clickScreen.addEventListener('click', () => {
    if (started) return;
    started = true;

    // Tam ekran isteği kullanıcı tıklamasıyla aynı anda tetiklenmeli
    goFullscreen();

    clickScreen.classList.add('hidden');
    bg.classList.add('revealed');
    glowLine.classList.add('show');
    noiseFlicker.classList.add('active');

    song.volume = 0;
    song.play().catch(()=>{});
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.04;
      if (vol >= 0.85){ vol = 0.85; clearInterval(fade); }
      song.volume = vol;
    }, 100);

    setTimeout(() => {
      infoTitle.classList.add('show');
      watchingEye.classList.add('show');
      revealInfo();
    }, 600);
  });

  // Her satır bir öncekinden biraz büyük ya da küçük olur (16px - 34px arası)
  function nextSize(){
    const delta = (Math.random() * 7) - 3.5; // -3.5 .. +3.5
    lastSize = Math.min(34, Math.max(16, lastSize + delta));
    return lastSize;
  }

  // Tüm satırlar başlık ile alt arasındaki alana sığacak şekilde
  // stream-inner'ı gerektiğinde ölçekler (kırpma/blur yok, sadece küçültme).
  function fitToContainer(){
    // önce doğal boyuta dön ki gerçek yükseklik ölçülebilsin
    streamInner.style.transform = 'scale(1)';
    const naturalHeight = streamInner.scrollHeight;
    const availableHeight = stream.clientHeight;

    if (naturalHeight > availableHeight && naturalHeight > 0){
      const scale = Math.max(0.35, availableHeight / naturalHeight);
      streamInner.style.transform = `scale(${scale})`;
    } else {
      streamInner.style.transform = 'scale(1)';
    }
  }

  function addLine(label, value, delay, extraClass){
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'line' + (extraClass ? ' ' + extraClass : '');
      div.style.fontSize = `${nextSize().toFixed(1)}px`;
      div.innerHTML = `<b>${label}:</b>${value}`;
      streamInner.appendChild(div);
      fitToContainer();
    }, delay);
  }

  // Pencere boyutu değişirse yeniden hizala
  window.addEventListener('resize', fitToContainer);

  function jitter(base, spread){
    return base + Math.floor(Math.random() * spread);
  }

  async function revealInfo(){
    let t = 150;

    // 1) Başlıktan hemen sonra ilk soru satırı
    addLine("STATUS", "who are you?", t, "question");

    // 2) Ardından IP adresi ve konum bilgileri
    t = jitter(t, 200) + 400;
    fetch('https://ipapi.co/json/')
      .then(res => res.json())
      .then(data => {
        let ti = t;
        addLine("IP ADDRESS", data.ip || "unknown", ti);
        ti = jitter(ti, 150) + 160;
        addLine("ISP", data.org || "unknown", ti);
        ti = jitter(ti, 150) + 160;
        addLine("CITY / COUNTRY", `${data.city || "?"}, ${data.country_name || "?"}`, ti);
        ti = jitter(ti, 150) + 160;
        addLine("COORDINATES", `${data.latitude || "?"}, ${data.longitude || "?"}`, ti);
        ti = jitter(ti, 150) + 160;
        addLine("TIMEZONE", data.timezone || "unknown", ti);

        // 3) IP bilgisinden sonra diğer cihaz/tarayıcı bilgileri devam eder
        continueWithDeviceInfo(ti + jitter(200, 200));
      })
      .catch(() => {
        addLine("IP ADDRESS", "connection blocked", t);
        continueWithDeviceInfo(t + jitter(300, 200));
      });
  }

  async function continueWithDeviceInfo(startDelay){
    const ua = navigator.userAgent;
    const platform = navigator.platform || "unknown";
    const lang = navigator.language || "unknown";
    const cores = navigator.hardwareConcurrency || "unknown";
    const mem = navigator.deviceMemory ? navigator.deviceMemory + " GB" : "unknown";
    const screenRes = `${screen.width}x${screen.height} (${screen.colorDepth}-bit)`;
    const windowRes = `${window.innerWidth}x${window.innerHeight}`;
    const cookies = navigator.cookieEnabled ? "ENABLED" : "DISABLED";
    const dnt = navigator.doNotTrack || "unspecified";
    const now = new Date().toLocaleString('en-US');

    const facts = [
      ["BROWSER", ua],
      ["PLATFORM", platform],
      ["LANGUAGE", lang],
      ["CPU THREADS", cores],
      ["MEMORY (approx)", mem],
      ["SCREEN", screenRes],
      ["WINDOW SIZE", windowRes],
      ["COOKIES", cookies],
      ["DO NOT TRACK", dnt],
      ["LOCAL TIME", now],
    ];

    let t = startDelay;
    facts.forEach(([label, value]) => {
      t = jitter(t, 130) + 160;
      addLine(label, value, t);
    });

    // GPU
    try{
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      const dbgInfo = gl.getExtension('WEBGL_debug_renderer_info');
      const renderer = gl.getParameter(dbgInfo.UNMASKED_RENDERER_WEBGL);
      t = jitter(t, 150) + 180;
      addLine("GPU", renderer, t);
    }catch(e){
      t = jitter(t, 150) + 180;
      addLine("GPU", "could not be read", t);
    }

    // Battery
    if (navigator.getBattery){
      try{
        const battery = await navigator.getBattery();
        t = jitter(t, 150) + 180;
        addLine("BATTERY", `${Math.round(battery.level*100)}% ${battery.charging ? "(charging)" : ""}`, t);
      }catch(e){}
    }

    t = jitter(t, 200) + 220;
    addLine("STATUS", "i found you", t);
  }
</script>

</body>
</html>
